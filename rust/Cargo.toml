[package]
name = "idrdesign_app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.102"
web-sys = { version = "0.3.79", features = ["console"] }
regex = "1.12.2"
tsify = { version = "0.5.6", features = ["js"] }
wasm-bindgen-futures = "0.4.55"
futures = "0.3.31"
thiserror = "2.0.17"
special = "0.11.4"
rand = "0.9.2"
bumpalo = { version = "3.19.1", features = ["collections"] }
web-time = "1.1.0"
